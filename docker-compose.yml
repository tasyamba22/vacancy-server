version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: vacancy-postgres
    environment:
      POSTGRES_DB: vacancy_db
      POSTGRES_USER: vacancy_user
      POSTGRES_PASSWORD: pass123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: